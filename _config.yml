# ============================================================
#  Hexo 站点配置 —— zhryhzs 的博客
#  主题：LostStar (MIT)
#  网址：https://zhryhzs.github.io
# ============================================================

# ---------- 站点 ----------
title: zhryhzs 的博客
subtitle: 记录学习与折腾
description: 记录学习、折腾与所得。
keywords: 博客,学习笔记,折腾
author: zhryhzs
language: zh-CN
timezone: Asia/Shanghai

# ---------- 网址 ----------
url: https://zhryhzs.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# ---------- 目录 ----------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ---------- 写作 ----------
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
# ★ 主题自带 Highlight.js，必须关掉 Hexo 内置高亮，否则代码块会出现双层样式
syntax_highlighter: highlight.js
highlight:
  enable: false
  line_number: false
  auto_detect: false
  tab_replace:
  wrap: false
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace:

# ---------- 首页 / 归档 / 分类 / 标签 ----------
index_generator:
  path: ''
  per_page: 6
  order_by: -date

archive_generator:
  enabled: true
  per_page: 0
  yearly: false
  monthly: false
  daily: false

category_generator:
  per_page: 10
tag_generator:
  per_page: 10

# ---------- 日期与分页 ----------
date_format: YYYY-MM-DD
time_format: HH:mm:ss
# 用 mtime 的话，GitHub Actions 每次拉代码都会把「更新日期」刷成构建时间
updated_option: date
per_page: 10
pagination_dir: page

# ---------- 主题 ----------
theme: lostar

# ---------- 部署 ----------
# 用 GitHub Actions 构建并发布，不需要 hexo-deployer-git
deploy:
  type: ''
